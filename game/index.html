<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SkyForge</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0e2f52; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: crosshair; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" aria-label="SkyForge: fly eight airframes over islands and mountains, dogfight bandit AI with guns, missiles and flares, weather storms and night ops, thread mission rings, land on the runway, and upgrade your tech tree, liveries and pilot career in the hangar"></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
